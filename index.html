<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <!-- Важно: разрешаем отправлять ПОЛНЫЙ URL (с path и query) в Referer всех исходящих запросов -->
    <meta name="referrer" content="unsafe-url" />

    <title>Привет!</title>
  </head>
  <body>
    <h1>Привет!</h1>
    <p>Эта страница используется для теста Webhook.site</p>

    <!-- 1) НО-JS пиксель — работает даже внутри <iframe sandbox="">
         Он отправит запрос на твой webhook и в заголовке Referer будет ПОЛНЫЙ URL
         текущей страницы (например, https://adelchernyatov.github.io/?cs=a7_iframe) -->
    <img
      src="https://webhook.site/345b698e-f77f-4b61-a723-893937326d12/px.gif?static=1"
      width="1" height="1" alt=""
      style="position:absolute;left:-9999px;top:-9999px"
      referrerpolicy="unsafe-url" />

    <!-- 2) JS-пиксель — добавляет полезные поля (url, ref, ua, язык, таймзона).
         В sandbox-iframe он НЕ выполнится, но для обычных визитов — да. -->
    <script>
      (function () {
        try {
          var u = "https://webhook.site/345b698e-f77f-4b61-a723-893937326d12/visit.gif"
                  + "?ts=" + Date.now()
                  + "&url=" + encodeURIComponent(location.href)
                  + "&ref=" + encodeURIComponent(document.referrer || "")
                  + "&ua=" + encodeURIComponent(navigator.userAgent || "")
                  + "&lang=" + encodeURIComponent(navigator.language || "")
                  + "&tz=" + encodeURIComponent(Intl.DateTimeFormat().resolvedOptions().timeZone || "");
          // GET через картинку - без CORS/префлайта, надёжно уходит даже при закрытии страницы
          new Image().src = u;
        } catch (e) {}
      })();
    </script>
  </body>
</html>
