<body>
  <h1>Привет!</h1>
  <p>Эта страница используется для теста Webhook.site</p>

  <!-- 1) OG-мета: многие превью-боты дергают og:image сразу после получения HTML -->
  <meta property="og:title" content="Ping">
  <meta property="og:description" content="Webhook ping test">
  <meta property="og:url" content="https://adelchernyatov.github.io/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://webhook.site/435adcdb-d6de-4168-872c-01569985b6dd?og=1">

  <!-- 2) Пиксель: сработает даже без JS, если HTML рендерится в браузере админа -->
  <img
    src="https://webhook.site/4f96edc2-a391-4b28-abe6-c8ac5ef97e96?v=pixel&ts=INIT"
    width="1" height="1" style="display:none" alt="">

  <!-- 3) JS-лог (оставляем — полезно для реальных пользователей) -->
  <script>
  (function() {
    // а) заменить ts у пикселя, чтобы обойти кэш
    const px = document.querySelector('img[src*="webhook.site"]');
    if (px) px.src = px.src.replace('INIT', Date.now());

    // б) отправить диагностический JSON (как у тебя)
    const webhookUrl = "https://webhook.site/4f96edc2-a391-4b28-abe6-c8ac5ef97e96";
    const data = {
      url: location.href,
      referrer: document.referrer,
      userAgent: navigator.userAgent,
      time: new Date().toISOString()
    };
    // Короткий GET (без громоздкого JSON в URL)
    const q = new URLSearchParams({v: 'js', ts: String(Date.now())});
    fetch(`${webhookUrl}?${q}`, {mode: 'no-cors'}).catch(()=>{});
  })();
  </script>
</body>
